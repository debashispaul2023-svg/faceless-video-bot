name: Clip & Schedule Pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "auto (pick next stream from channels) | clip (use video_url)"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - clip
      video_url:
        description: "YouTube live/VOD URL (for clip mode)"
        required: false
        default: ""
      upload:
        description: "Schedule/upload to YouTube after processing (turn OFF for test)"
        required: false
        default: true
        type: boolean
      max_clips:
        description: "How many best clips to produce (blank = fill the 7-day queue)"
        required: false
        default: ""
      layout:
        description: "Video layout: facecam (facecam top + 3:4 gameplay) | blur | crop"
        required: false
        default: "facecam"
        type: choice
        options:
          - facecam
          - blur
          - crop
      facecam_box:
        description: "Facecam box x,y,w,h as fractions of the frame (facecam layout)"
        required: false
        default: "0.74,0,0.26,0.26"
      live_from_start:
        description: "Stream is still live: read it from the beginning"
        required: false
        default: false
        type: boolean
      cleanup:
        description: "Delete temp files, keep only the finished .mp4 Shorts"
        required: false
        default: true
        type: boolean
  schedule:
    # Daily: tops up the YouTube schedule queue (1 Short/day) from the newest unprocessed GTA 6 stream.
    - cron: "0 8 * * *"

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Deno (yt-dlp JS challenge runtime)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install system packages (ffmpeg, fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fontconfig fonts-montserrat fonts-noto-core

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import yt_dlp; print('yt-dlp', yt_dlp.version.__version__)"
          deno --version
          ffmpeg -version | head -1

      # Optional Netscape cookies for restricted extracts (NOT OAuth).
      # Never echo secret contents.
      - name: Prepare YouTube cookies file
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "${YOUTUBE_COOKIES}" ]; then
            printf '%s\n' "$YOUTUBE_COOKIES" > cookies.txt
            chmod 600 cookies.txt
            BYTES=$(wc -c < cookies.txt | tr -d ' ')
            echo "[+] cookies.txt prepared (${BYTES} bytes) — contents not logged"
          else
            echo "[i] secrets.YOUTUBE_COOKIES empty — public extraction only"
          fi

      - name: Run pipeline
        timeout-minutes: 110
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          ELEVENLABS_API_KEYS: ${{ secrets.ELEVENLABS_API_KEYS }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          YOUTUBE_COOKIES_FILE: cookies.txt
          # GITHUB_* provided by Actions for diagnostic email run URL
          CLIP_CHANNELS: ${{ vars.CLIP_CHANNELS || '@IShowSpeed,@MrBeast' }}
          CLIP_TITLE_KEYWORDS: ${{ vars.CLIP_TITLE_KEYWORDS || 'gta,grand theft auto' }}
          CLIP_LAYOUT: ${{ github.event.inputs.layout || vars.CLIP_LAYOUT || 'blur' }}
          CLIP_FACECAM: ${{ github.event.inputs.facecam_box || vars.CLIP_FACECAM || '0.74,0,0.26,0.26' }}
          CLIP_LIVE_FROM_START: ${{ github.event.inputs.live_from_start == 'true' && '1' || '0' }}
          CLIP_CLEANUP: ${{ github.event.inputs.cleanup == 'true' && '1' || '0' }}
          # workflow inputs go through env (never interpolated into the shell script)
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_URL: ${{ github.event.inputs.video_url }}
          INPUT_MAX: ${{ github.event.inputs.max_clips }}
          INPUT_UPLOAD: ${{ github.event.inputs.upload }}
        run: |
          set -e
          MODE="${INPUT_MODE:-auto}"
          URL="${INPUT_URL:-}"
          MAX="${INPUT_MAX:-}"
          # workflow_dispatch boolean may be string; schedule has no inputs
          UPLOAD_RAW="${INPUT_UPLOAD:-}"
          if [ -z "$UPLOAD_RAW" ] || [ "$UPLOAD_RAW" = "true" ]; then
            UPLOAD="true"
          else
            UPLOAD="false"
          fi
          export AUTO_UPLOAD="$UPLOAD"

          echo "[i] mode=$MODE upload=$UPLOAD max_clips=$MAX"
          if [ -f cookies.txt ]; then
            export YOUTUBE_COOKIES_FILE="$PWD/cookies.txt"
            echo "[i] cookiefile path set (not printing contents)"
          fi

          if [ "$MODE" = "auto" ]; then
            ARGS=""
            if [ "$UPLOAD" = "true" ]; then ARGS="--upload"; fi
            if [ -n "$MAX" ]; then ARGS="$ARGS --max-clips $MAX"; fi
            python clipper.py --auto $ARGS
          else
            if [ -z "$URL" ]; then
              echo "mode=clip needs video_url"; exit 1
            fi
            ARGS=""
            if [ "$UPLOAD" = "true" ]; then ARGS="--upload"; fi
            python clipper.py "$URL" --max-clips "${MAX:-10}" $ARGS
          fi

      - name: Remember processed streams
        if: success()
        run: |
          if [ -n "$(git status --porcelain assets/processed_streams.json)" ]; then
            git config user.name "clip-bot"
            git config user.email "clip-bot@users.noreply.github.com"
            git add assets/processed_streams.json
            git commit -m "chore: mark stream as clipped [skip ci]"
            git push
          fi

      - name: Upload produced clips artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clip-output
          path: |
            output/clips/**/short_*.mp4
            output/clips/**/*.json
          if-no-files-found: warn
          retention-days: 7
