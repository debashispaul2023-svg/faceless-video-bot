name: Daily Automatic Video Generator & Publisher

on:
  schedule:
    # দিনে মাত্র ১ বার চলে — এই একটা run-ই ৩টা ভিডিও বানিয়ে
    # publishAt দিয়ে ৩টা fixed IST slot-এ (3:00 AM / 5:00 PM / 10:30 PM)
    # schedule করে দেয় — find_next_available_slots() আগে থেকে YouTube
    # চেক করে ঠিক কোন দিনে বসবে সেটা ঠিক করে (আজ ফুল থাকলে পরের দিন)।
    # 08:00 UTC (~1:30 PM IST)-এ চালানো হচ্ছে যাতে generate+render+upload
    # করার জন্য যথেষ্ট সময় থাকে।
    - cron: '0 8 * * *'
  workflow_dispatch: # ম্যানুয়ালি টেস্ট করার জন্য

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # গিটহাবে হিস্ট্রি ফাইল কমিট করার জন্য পারমিশন

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install System Dependencies (FFmpeg, ImageMagick, Fonts)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg imagemagick fonts-dejavu-core

    - name: Install Python Packages
      run: |
        pip install -r requirements.txt

    - name: Run Auto Video Generator & Publisher
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        ELEVENLABS_API_KEYS: ${{ secrets.ELEVENLABS_API_KEYS }}
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      run: |
        python main.py

    - name: Commit updated bot state (topics history, analytics log)
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        for f in assets/used_topics.json assets/published_log.json assets/category_scores.json; do
          if [ -f "$f" ]; then
            git add "$f"
          fi
        done
        git commit -m "chore: update bot state [skip ci]" || exit 0
        git push

  channel-manager:
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: always()   # build-and-publish fail করলেও চলবে, যাতে activity-alert কাজ করে

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Python Packages
      run: pip install -r requirements.txt

    - name: Run AI Channel Manager (LIVE — applies changes)
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        # LIVE মোডে চলছে — title/description/tags/thumbnail সত্যিই বদলে দেবে।
        # সমস্যা মনে হলে "false" করে আবার dry-run-এ ফিরিয়ে নিতে পারেন।
        CHANNEL_MANAGER_APPLY_CHANGES: "true"
      run: python channel_manager.py
