name: Sunny Grove Friends Pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "demo | episode | compile | plan"
        required: true
        default: "demo"
        type: choice
        options:
          - demo
          - plan
          - episode
          - compile
      idea:
        description: "Original story idea (episode mode)"
        required: false
        default: "Toto loses a giant mango"
      upload:
        description: "Upload to YouTube after QC (still private)"
        required: false
        default: false
        type: boolean
  schedule:
    # Daily generate only. Upload stays off unless AUTO_UPLOAD secret is true
    # AND the workflow input upload=true.
    - cron: "0 8 * * *"

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEYS: ${{ secrets.ELEVENLABS_API_KEYS }}
          ELEVENLABS_VOICE_TOTO: ${{ secrets.ELEVENLABS_VOICE_TOTO }}
          ELEVENLABS_VOICE_MOMO: ${{ secrets.ELEVENLABS_VOICE_MOMO }}
          ELEVENLABS_VOICE_PIKU: ${{ secrets.ELEVENLABS_VOICE_PIKU }}
          ELEVENLABS_VOICE_FIKO: ${{ secrets.ELEVENLABS_VOICE_FIKO }}
          ELEVENLABS_VOICE_NARRATOR: ${{ secrets.ELEVENLABS_VOICE_NARRATOR }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          STORY_PROVIDER: ${{ secrets.STORY_PROVIDER }}
          VISUAL_PROVIDER: ${{ secrets.VISUAL_PROVIDER }}
          TTS_PROVIDER: ${{ secrets.TTS_PROVIDER }}
          AUTO_UPLOAD: "false"
        run: |
          MODE="${{ github.event.inputs.mode || 'demo' }}"
          IDEA="${{ github.event.inputs.idea || 'Toto loses a giant mango' }}"
          UPLOAD="${{ github.event.inputs.upload || 'false' }}"

          # Safe defaults when secrets are empty (Actions still runs --demo)
          export STORY_PROVIDER="${STORY_PROVIDER:-local}"
          export VISUAL_PROVIDER="${VISUAL_PROVIDER:-local}"
          export TTS_PROVIDER="${TTS_PROVIDER:-local}"

          if [ "$MODE" = "demo" ]; then
            python main.py --demo
          elif [ "$MODE" = "plan" ]; then
            python main.py --plan-only --idea "$IDEA"
          elif [ "$MODE" = "compile" ]; then
            python main.py --compile
          else
            if [ "$UPLOAD" = "true" ]; then
              python main.py --idea "$IDEA" --upload
            else
              python main.py --idea "$IDEA"
            fi
          fi

      - name: Upload produced media
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunny-grove-output
          path: |
            output/episodes/**/final.mp4
            output/episodes/**/thumbnail.jpg
            output/episodes/**/production_plan.json
            output/episodes/**/validation.json
            output/compilations/*.mp4
          if-no-files-found: warn
          retention-days: 14
