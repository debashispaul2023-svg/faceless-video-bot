name: Clip & Schedule Pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "clip | demo | plan | episode"
        required: true
        default: "clip"
        type: choice
        options:
          - clip
          - demo
          - plan
          - episode
      video_url:
        description: "YouTube live/VOD URL (for clip mode)"
        required: false
        default: ""
      idea:
        description: "Original story idea (episode mode — legacy)"
        required: false
        default: ""
      upload:
        description: "Schedule/upload to YouTube after processing (turn OFF for test)"
        required: false
        default: true
        type: boolean
      max_clips:
        description: "How many best clips to produce"
        required: false
        default: "3"
  schedule:
    # Optional daily check; clip mode needs a URL so mainly manual
    - cron: "0 8 * * *"

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          AUTO_UPLOAD: "${{ github.event.inputs.upload || 'true' }}"
        run: |
          MODE="${{ github.event.inputs.mode || 'clip' }}"
          URL="${{ github.event.inputs.video_url || '' }}"
          IDEA="${{ github.event.inputs.idea || '' }}"
          MAX="${{ github.event.inputs.max_clips || '3' }}"
          UPLOAD="${{ github.event.inputs.upload || 'true' }}"

          if [ "$MODE" = "clip" ]; then
            if [ -z "$URL" ]; then
              echo "No video_url provided for clip mode. Skipping."
              exit 0
            fi
            if [ "$UPLOAD" = "true" ]; then
              python main.py --clip-url "$URL" --max-clips "$MAX" --upload
            else
              python main.py --clip-url "$URL" --max-clips "$MAX"
            fi
          elif [ "$MODE" = "demo" ]; then
            python main.py --demo
          elif [ "$MODE" = "plan" ]; then
            python main.py --plan-only --idea "$IDEA"
          else
            if [ "$UPLOAD" = "true" ]; then
              python main.py --idea "$IDEA" --upload
            else
              python main.py --idea "$IDEA"
            fi
          fi

      - name: Upload produced clips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clip-output
          path: |
            output/clips/**/*.mp4
            output/clips/**/*.json
          if-no-files-found: warn
          retention-days: 7
