name: Daily Automatic Video Generator & Publisher

on:
  schedule:
    # দিনে মাত্র ১ বার চলে — এই একটা run-ই ৩টা ভিডিও বানিয়ে
    # publishAt দিয়ে ৩টা আলাদা সময়ে (7:30 AM / 1:00 PM / 5:30 PM EDT)
    # schedule করে দেয়। প্রথম slot-এর (11:30 UTC) অনেক আগে, 08:00 UTC-এ
    # চালানো হচ্ছে যাতে generate+render+upload করার জন্য যথেষ্ট সময় থাকে।
    - cron: '0 8 * * *'
  workflow_dispatch: # ম্যানুয়ালি টেস্ট করার জন্য

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # গিটহাবে হিস্ট্রি ফাইল কমিট করার জন্য পারমিশন

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install System Dependencies (FFmpeg, ImageMagick, Fonts)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg imagemagick fonts-dejavu-core

    - name: Install Python Packages
      run: |
        pip install -r requirements.txt

    - name: Run Auto Video Generator & Publisher
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        ELEVENLABS_API_KEYS: ${{ secrets.ELEVENLABS_API_KEYS }}
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      run: |
        python main.py

    - name: Commit updated bot state (topics history, analytics log)
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        for f in assets/used_topics.json assets/published_log.json assets/category_scores.json; do
          if [ -f "$f" ]; then
            git add "$f"
          fi
        done
        git commit -m "chore: update bot state [skip ci]" || exit 0
        git push

  channel-manager:
    runs-on: ubuntu-latest
    # চালু করার জন্য: 9:00 AM UTC-তে (প্রথম job-এর পরে, বাকি video uploads complete হওয়ার পরে)
    needs: build-and-publish
    
    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Python Packages
      run: pip install -r requirements.txt

    - name: Run AI Channel Manager (DRY RUN by default)
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        # DRY RUN মোডে শুরু করুন (শুধু log করবে, video edit করবে না)।
        # কয়েকদিনের log দেখার পর নিশ্চিত হলে "true" করুন।
        CHANNEL_MANAGER_APPLY_CHANGES: "true"
      run: python channel_manager.py
