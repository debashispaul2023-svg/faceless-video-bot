name: Daily Automatic Video Generator & Publisher

on:
  schedule:
    # দিনে ১ বার চলে — ৩টি ভিডিও শিডিউল করে (7:30 AM / 1:00 PM / 5:30 PM EDT)
    - cron: '0 8 * * *'
  workflow_dispatch: # ম্যানুয়ালি ট্রিগার করার জন্য

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install System Dependencies (FFmpeg, ImageMagick, Fonts)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg imagemagick fonts-dejavu-core

    - name: Install Python Packages
      run: |
        pip install -r requirements.txt

    - name: Run Auto Video Generator & Publisher
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      run: |
        python main.py

    - name: Commit updated generator states and logs
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        for f in assets/used_topics.json assets/published_log.json assets/category_scores.json assets/top_performing_patterns.json; do
          if [ -f "$f" ]; then
            git add "$f"
          fi
        done
        git commit -m "chore: update generator state and analytics [skip ci]" || exit 0
        git push

  channel-manager:
    needs: build-and-publish
    if: always() # build fail করলেও চ্যানেল ম্যানেজমেন্ট এবং অডিট চলবে
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Python Packages
      run: |
        pip install -r requirements.txt

    - name: Run Channel Manager
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      run: |
        python channel_manager.py

    - name: Commit channel manager state
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        for f in assets/channel_manager_actions.json assets/retention_insights.json; do
          if [ -f "$f" ]; then
            git add "$f"
          fi
        done
        git commit -m "chore: update channel manager state [skip ci]" || exit 0
        git push
