Nname: Daily Automatic Video Generator & Publisher

on:
  schedule:
    # দিনে মাত্র ১ বার চলে — এই একটা run-ই ১টা high-quality ভিডিও বানিয়ে
    # publishAt দিয়ে fixed IST slot-এ (5:00 PM) schedule করে দেয় —
    # find_next_available_slots() আগে থেকে YouTube চেক করে ঠিক কোন দিনে
    # বসবে সেটা ঠিক করে (আজ ফুল থাকলে পরের দিন)।
    # 08:00 UTC (~1:30 PM IST)-এ চালানো হচ্ছে যাতে generate+render+upload
    # করার জন্য যথেষ্ট সময় থাকে।
    - cron: '0 8 * * *'
  workflow_dispatch: # ম্যানুয়ালি টেস্ট করার জন্য

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # গিটহাবে হিস্ট্রি ফাইল কমিট করার জন্য পারমিশন

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install System Dependencies (FFmpeg, ImageMagick, Fonts)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg imagemagick fonts-dejavu-core

    - name: Install Python Packages
      run: |
        pip install -r requirements.txt

    - name: Run Auto Video Generator & Publisher
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        ELEVENLABS_API_KEYS: ${{ secrets.ELEVENLABS_API_KEYS }}
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      run: |
        python main.py

    - name: Commit updated bot state (topics history, analytics log)
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"

        for f in assets/used_topics.json assets/published_log.json assets/category_scores.json assets/top_performing_patterns.json; do
          if [ -f "$f" ]; then
            git add "$f"
          fi
        done

        if git diff --cached --quiet; then
          echo "No changes to commit."
          exit 0
        fi

        git commit -m "chore: update bot state [skip ci]"

        # Push can be rejected if something else (e.g. a manual GitHub web
        # edit, or the channel-manager job) committed to main while this
        # job was running — pull/rebase to reconcile, then retry a few
        # times before giving up.
        for i in 1 2 3; do
          if git pull --rebase origin main && git push; then
            echo "Pushed successfully."
            exit 0
          fi
          echo "Push attempt $i failed, retrying in 5s..."
          sleep 5
        done

        echo "Could not push after 3 attempts — bot state wasn't saved this run."
        exit 0

  channel-manager:
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: always()
    permissions:
      contents: write # রিটেনশন/অ্যাকশন-লগ ফাইল কমিট করার জন্য পারমিশন

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install System Dependencies (fonts for thumbnail generation)
      run: |
        sudo apt-get update
        sudo apt-get install -y fonts-dejavu-core

    - name: Install Python Packages
      run: pip install -r requirements.txt

    - name: Run AI Channel Manager (Gemini proposes + Claude reviews)
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        CHANNEL_MANAGER_APPLY_CHANGES: "false"
      run: python channel_manager.py

    - name: Commit channel manager state
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"

        for f in assets/channel_manager_actions.json assets/retention_insights.json; do
          if [ -f "$f" ]; then
            git add "$f"
          fi
        done

        if git diff --cached --quiet; then
          echo "No changes to commit."
          exit 0
        fi

        git commit -m "chore: update channel manager state [skip ci]"

        # Push can be rejected if something else (e.g. a manual GitHub web
        # edit, or the build-and-publish job) committed to main while this
        # job was running — pull/rebase to reconcile, then retry a few
        # times before giving up.
        for i in 1 2 3; do
          if git pull --rebase origin main && git push; then
            echo "Pushed successfully."
            exit 0
          fi
          echo "Push attempt $i failed, retrying in 5s..."
          sleep 5
        done

        echo "Could not push after 3 attempts — channel manager's own state"
        echo "wasn't saved this run, but nothing else was affected."
        exit 0
