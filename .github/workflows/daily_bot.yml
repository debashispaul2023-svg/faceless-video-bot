name: Daily Automatic Video Generator & Publisher

on:
  schedule:
    # সঠিক IST সময় অনুযায়ী ইউএস প্রাইম টাইমের ইউটিসি (UTC) ক্রন জব
    # ৩:০০ AM IST (21:30 UTC), ৫:০০ PM IST (11:30 UTC), ১০:৩০ PM IST (17:00 UTC)
    - cron: '30 21,11,17 * * *'
  workflow_dispatch: # ম্যানুয়ালি টেস্ট করার জন্য

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # গিটহাবে হিস্ট্রি ফাইল কমিট করার জন্য পারমিশন

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install System Dependencies (FFmpeg)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg imagemagick

    - name: Install Python Packages
      run: |
        pip install -r requirements.txt

    - name: Run Auto Video Generator & Publisher
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      run: |
        python main.py

    - name: Commit updated used topics history
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add assets/used_topics.json
        git commit -m "chore: update used topics history [skip ci]" || exit 0
        git push
